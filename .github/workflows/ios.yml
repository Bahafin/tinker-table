# The iPad/iPhone app, built on GitHub's Macs (there's no Mac here). See docs/app.md.
# - Every push to main that touches the game: build for the simulator, run it on an iPad and
#   an iPhone simulator, and keep screenshots as the "bumpity-ios-screens" artifact.
# - Run by hand with "Send to TestFlight" ticked: sign it and upload it to App Store Connect.
#   That needs the Apple secrets described in docs/app.md.
name: iOS app

on:
  push:
    branches: [main]
    paths: ['src/**', 'public/**', 'index.html', 'ios/**', 'capacitor.config.ts', 'package*.json', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Send to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 30
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      - name: Run it on an iPad and an iPhone, and take screenshots
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p shots
          shoot() {
            UDID=$(xcrun simctl list devices available -j | jq -r --arg p "$1" '[.devices[][] | select(.name | test($p))][0].udid')
            NAME=$(xcrun simctl list devices available -j | jq -r --arg u "$UDID" '[.devices[][] | select(.udid == $u)][0].name')
            echo "Using $NAME ($UDID)"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" app.bumpity.game
            sleep 15
            # First launch shows the grown-ups' "Before you hand it over" card over the front page.
            xcrun simctl io "$UDID" screenshot "shots/$2-first-launch.png"
            # The web view's console, in case something failed to start.
            xcrun simctl spawn "$UDID" log show --last 1m --style compact \
              --predicate 'subsystem CONTAINS "capacitor" OR process == "App"' > "shots/$2-log.txt" 2>&1 || true
            xcrun simctl shutdown "$UDID"
          }
          shoot 'iPad' ipad
          shoot '^iPhone' iphone
      - uses: actions/upload-artifact@v4
        with:
          name: bumpity-ios-screens
          path: shots
          retention-days: 14

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: simulator
    runs-on: macos-latest
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check the Apple secrets are set
        run: |
          for v in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v (see docs/app.md)"; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync ios
      # Signing without a Mac or a registered device: a distribution certificate and an App Store
      # profile made through the API for this run only, then removed (scripts/apple-signing.mjs).
      - name: Make a signing certificate and profile
        run: |
          S="$RUNNER_TEMP/sign"; mkdir -p "$S"
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes -keyout "$S/key.pem" -subj "/CN=Bumpity CI" -out "$S/csr.pem" 2>/dev/null
          node scripts/apple-signing.mjs setup "$S/csr.pem" "$S" >> "$GITHUB_ENV"
          /usr/bin/openssl x509 -inform DER -in "$S/dist.cer" -out "$S/dist.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$S/key.pem" -in "$S/dist.pem" -out "$S/dist.p12" -passout pass:ci
          KC="$RUNNER_TEMP/sign.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$S/wwdr.cer"
          security import "$S/wwdr.cer" -k "$KC" -A || true
          security import "$S/dist.p12" -k "$KC" -P ci -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$S/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
          mkdir -p "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          cp "$S/app.mobileprovision" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"
          rm -f "$S/key.pem" "$S/dist.p12"
          security find-identity -v -p codesigning "$KC"
      - name: Archive, sign and upload to App Store Connect
        run: |
          # Manual signing for the app target only (the Swift packages sign nothing).
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = "Apple Distribution"; PROVISIONING_PROFILE_SPECIFIER = "'"$APPLE_PROFILE_NAME"'"; DEVELOPMENT_TEAM = '"$TEAM_ID"';/' \
            ios/App/App.xcodeproj/project.pbxproj
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -n 30
          test -d "$RUNNER_TEMP/App.xcarchive"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>app.bumpity.game</key><string>$APPLE_PROFILE_NAME</string></dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          KEYDIR="$HOME/.appstoreconnect/private_keys"; mkdir -p "$KEYDIR"
          KEY="$KEYDIR/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$KEY"
      - name: Remove the signing certificate and profile
        if: always()
        run: |
          [ -n "$APPLE_CERT_ID" ] && node scripts/apple-signing.mjs cleanup "$APPLE_CERT_ID" "$APPLE_PROFILE_ID" || true
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
