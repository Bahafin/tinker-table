<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bumpity" />
    <meta name="theme-color" content="#e9dcc3" />
    <title>Bumpity</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <meta name="description" content="A calm chain-reaction puzzle game for children aged 5 to 8, to play together with a grown-up." />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Level map -->
    <section id="map" class="screen">
      <h1 class="logo"><img src="logo.svg" alt="Bumpity" /></h1>
      <div id="levels"></div>
      <!-- The sticker book: one sticker for every finished level. -->
      <button id="btn-book" class="book-btn" aria-label="Sticker book">
        <svg viewBox="0 0 48 48"><path d="M8 10c6-2 11-1 16 3v27c-5-4-10-5-16-3z" class="page" /><path d="M40 10c-6-2-11-1-16 3v27c5-4 10-5 16-3z" class="page" /><circle cx="15" cy="21" r="4" class="dot1" /><path d="M32 17l1.6 3.3 3.6.5-2.6 2.5.6 3.6-3.2-1.7-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z" class="dot2" /></svg>
        <span class="new hidden"></span>
      </button>
      <!-- Grown-ups' corner: behind the PIN, or a sum in words until a PIN is set (askGrownup). -->
      <button id="btn-grownups" class="grownups-btn" aria-label="For grown-ups">
        <svg viewBox="0 0 48 48"><circle cx="17" cy="13" r="5" /><path d="M8 40V28a9 9 0 0 1 18 0v12" /><circle cx="34" cy="22" r="3.5" /><path d="M28 40v-7a6 6 0 0 1 12 0v7" /></svg>
        <small>Grown-ups</small>
      </button>
    </section>

    <!-- Sticker book: drag stickers from the strip onto the page, anywhere. -->
    <section id="book" class="screen hidden">
      <header class="bar">
        <button id="btn-book-close" class="icon" aria-label="Back to the rooms">
          <svg viewBox="0 0 48 48"><path d="M38 24H12M22 13 11 24l11 11" /></svg>
        </button>
      </header>
      <div id="book-page" class="book-page" role="img" aria-label="Sticker page"></div>
      <div id="book-strip" class="book-strip" aria-label="Stickers to stick"></div>
    </section>

    <!-- Grown-ups' corner (text is fine here: it's for parents). Five short sections. -->
    <section id="grownups" class="screen hidden">
      <header class="gu-bar">
        <button id="btn-gu-close" class="icon" aria-label="Back to the game">
          <svg viewBox="0 0 48 48"><path d="M14 14l20 20M34 14 14 34" /></svg>
        </button>
        <h2>For grown-ups</h2>
      </header>
      <div class="gu-main">
        <nav class="gu-nav" role="tablist" aria-label="Sections">
          <button role="tab" data-sec="safety"><svg viewBox="0 0 48 48"><rect x="11" y="21" width="26" height="19" rx="4" /><path d="M17 21v-5a7 7 0 0 1 14 0v5" /></svg><span>Safety</span></button>
          <button role="tab" data-sec="play"><svg viewBox="0 0 48 48"><circle cx="17" cy="14" r="5" /><path d="M8 40V28a9 9 0 0 1 18 0v12" /><circle cx="34" cy="22" r="3.5" /><path d="M28 40v-7a6 6 0 0 1 12 0v7" /></svg><span>Play together</span></button>
          <button role="tab" data-sec="talk"><svg viewBox="0 0 48 48"><path d="M8 12h32v20H22l-9 7v-7H8z" /></svg><span>Talk cards</span></button>
          <button role="tab" data-sec="made"><svg viewBox="0 0 48 48"><path d="M24 40S8 31 8 19.5a8.5 8.5 0 0 1 16-4 8.5 8.5 0 0 1 16 4C40 31 24 40 24 40z" /></svg><span>Made here</span></button>
          <button role="tab" data-sec="settings"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="6" /><path d="M24 6v6M24 36v6M6 24h6M36 24h6M11 11l4 4M33 33l4 4M37 11l-4 4M15 33l-4 4" /></svg><span>Settings</span></button>
        </nav>
        <article id="gu-body" class="gu-body"></article>
      </div>
    </section>

    <!-- Build / play -->
    <section id="play" class="screen hidden">
      <header class="bar">
        <button id="btn-home" class="icon" aria-label="Home">
          <svg viewBox="0 0 48 48"><path d="M8 24 24 10l16 14" /><path d="M13 21v17h22V21" /><path d="M21 38v-9h6v9" /></svg>
        </button>
        <button id="btn-goal" class="goal" aria-label="Say the goal again">
          <canvas id="goal-pic" width="200" height="64"></canvas>
          <svg class="speaker" viewBox="0 0 48 48"><path d="M8 19h8l10-8v26l-10-8H8z" class="fill" /><path d="M32 17a9 9 0 0 1 0 14M36 12a15 15 0 0 1 0 24" /></svg>
        </button>
        <div class="spacer"></div>
        <!-- Toy box and puzzle maker: take everything off the table (tap twice). -->
        <button id="btn-clear" class="icon clear hidden" aria-label="Clear the table">
          <svg viewBox="0 0 48 48"><path d="M12 15h24l-2.5 25h-19z" class="bin" /><path d="M8 15h32M19 15v-4h10v4M20 21v13M28 21v13" /></svg>
        </button>
        <!-- Toy box only: keep the machine on the table. -->
        <button id="btn-save" class="icon save hidden" aria-label="Keep my machine">
          <svg viewBox="0 0 48 48"><path d="M24 40S8 31 8 19.5a8.5 8.5 0 0 1 16-4 8.5 8.5 0 0 1 16 4C40 31 24 40 24 40z" class="heart" /></svg>
        </button>
        <!-- Puzzle maker only: turn the machine on the table into a puzzle. -->
        <button id="btn-make" class="icon make hidden" aria-label="Make a puzzle" aria-pressed="false">
          <svg viewBox="0 0 48 48"><path d="M24 6l4.6 9.4 10.4 1.5-7.5 7.3 1.8 10.3L24 29.6l-9.3 4.9 1.8-10.3L9 16.9l10.4-1.5z" class="star" /><circle cx="24" cy="38" r="3.5" class="fill" /><path d="M24 34.5V30" /></svg>
        </button>
        <button id="btn-make-done" class="go hidden" aria-label="Check my puzzle">
          <svg viewBox="0 0 48 48"><path d="M12 25l8 8 16-17" /></svg>
        </button>
        <!-- Appears after a couple of missed runs: shows a ghost of a missing part. -->
        <button id="btn-hint" class="icon hint hidden" aria-label="Hint">
          <svg viewBox="0 0 48 48"><path d="M24 7a12 12 0 0 0-7 21.7c1.3 1 2 2.3 2 3.8V34h10v-1.5c0-1.5.7-2.8 2-3.8A12 12 0 0 0 24 7z" class="bulb" /><path d="M19 39h10M21 43h6" /><path d="M24 2v1M8 10l1 1M40 10l-1 1M4 22h1M43 22h1" class="rays" /></svg>
        </button>
        <!-- Guess the path: draw where you think it will go, then press Go. -->
        <button id="btn-guess" class="icon" aria-label="Draw where it will go" aria-pressed="false">
          <svg viewBox="0 0 48 48"><path d="M30 9l9 9-19 19-11 2 2-11z" class="pencil" /><path d="M26 13l9 9" /><path d="M6 44c6-2 9 1 15-1" class="crayon" /></svg>
        </button>
        <button id="btn-slow" class="icon" aria-label="Slow motion" aria-pressed="false">
          <svg viewBox="0 0 48 48"><path d="M5 37h31c5 0 8-3 8-8" /><circle cx="20" cy="25" r="11" /><path d="M20 25a3.5 3.5 0 1 1 3.5-3.5a7 7 0 0 1-7 7" /><path d="M39 29l-3-10M44 29l1-10" /><circle cx="36" cy="18" r="1.5" class="fill" /><circle cx="45" cy="18" r="1.5" class="fill" /></svg>
        </button>
        <button id="btn-go" class="go" aria-label="Go">
          <svg viewBox="0 0 48 48"><path d="M17 11 37 24 17 37z" class="fill" /></svg>
        </button>
        <button id="btn-stop" class="go stop hidden" aria-label="Stop">
          <svg viewBox="0 0 48 48"><rect x="14" y="14" width="20" height="20" rx="3" class="fill" /></svg>
        </button>
      </header>
      <canvas id="stage"></canvas>
      <!-- A phone held upright: a picture asking to turn it on its side (no words). -->
      <div class="turn" role="img" aria-label="Turn your phone on its side">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <path d="M22 60a38 38 0 0 1 62-29M98 60a38 38 0 0 1-62 29" class="turn-arrow" />
          <path d="M78 22l7 9-11 3M42 98l-7-9 11-3" class="turn-arrow" />
          <g class="turn-phone"><rect x="44" y="30" width="32" height="60" rx="7" /><path d="M56 82h8" /></g>
        </svg>
      </div>
      <div id="won" class="won hidden">
        <!-- Film strip: snapshots of the winning run, in order. Tap one to watch it again. -->
        <div id="film" class="film" role="group" aria-label="What happened"></div>
        <button id="btn-replay" class="icon big" aria-label="Watch again slowly">
          <svg viewBox="0 0 48 48"><path d="M12 24a12 12 0 1 0 4-9" /><path d="M10 9v8h8" /></svg>
        </button>
        <button id="btn-next" class="go big" aria-label="Next">
          <svg viewBox="0 0 48 48"><path d="M10 24h26M26 13l11 11-11 11" /></svg>
        </button>
        <button id="btn-home2" class="icon big" aria-label="Home">
          <svg viewBox="0 0 48 48"><path d="M8 24 24 10l16 14" /><path d="M13 21v17h22V21" /><path d="M21 38v-9h6v9" /></svg>
        </button>
      </div>
    </section>

    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
